# FinalCircle nginx site (see docs/deployment.md).
# Copy to /etc/nginx/sites-available/finalcircle, replacing ff.mydomain.example,
# then: ln -s ../sites-available/finalcircle /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS is added afterwards by: certbot --nginx -d ff.mydomain.example

# Connection header for WebSockets. Planecircle's site on the same VPS already defines this map: keep only one of them
# (nginx -t reports a duplicate).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache of the card images relayed on /ffimg/: each image is asked of Square Enix's CDN (or of the server's store) only
# once. 1 GB covers the whole catalog in both languages and both sizes; an image unused for 60 days is forgotten.
proxy_cache_path /var/cache/nginx/finalcircle-ffimg levels=1:2 keys_zone=finalcircle_ffimg:10m max_size=1g inactive=60d use_temp_path=off;

# The pages' security headers (nosniff, X-Frame-Options, CSP…) come from the Node server. Once HTTPS is added by
# certbot, in the "listen 443" block:
#     add_header Strict-Transport-Security "max-age=31536000" always;

server {
    listen 80;
    listen [::]:80;
    server_name ff.mydomain.example;

    # Online play: WebSocket. Long timeout: a game can stay quiet for minutes (the server pings every 25 s anyway).
    location /ws {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The Host the browser sent, port included: the server accepts a WebSocket only from its own origin.
        proxy_set_header Host $http_host;
        # The player's real address (the server's caps per address): X-Forwarded-For can be filled by the client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Card images through the server's relay (allow list, one CDN request at a time), cached here for 60 days. A 503
    # (the CDN refuses for now) is not cached: the image is asked again later.
    location /ffimg/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache finalcircle_ffimg;
        # One image per path, whatever the query string.
        proxy_cache_key $scheme$host$uri;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1h;
        # Many players asking for the same new image: a single request goes to the server.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
    }

    # Interface (the built client) and /healthz.
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
